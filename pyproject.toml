[project]
name = "coffee"
version = "0.1.0"
description = "Может, немного кофе?"
readme = "README.md"
authors = [
    { name = "Aleksandr Prosvirnin", email = "prosvirnin.a@outlook.com" },
]
requires-python = ">=3.14"
dependencies = [
    "pynput>=1.8.2",
]

[project.scripts]
coffee = "coffee:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.16.6",
    "types-pynput>=1.8.1.20260712",
]

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

exclude = [
  ".git",
  "__pycache__",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "ANN", "UP"]

ignore = [
    "UP032", # Сообщения журналов форматируются через .format().
    "E203",
]

[tool.ruff.format]
quote-style = "single"
